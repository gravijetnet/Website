
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>example.invalid is back!</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* Modern, professional developer fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #5865F2; /* Official Discord Blurple */
            --accent-hover: #4752C4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            /* Subtle top glow instead of generic gradients */
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e 0%, transparent 60%);
        }

        h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 0.2em;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-bottom: 3.5rem;
            font-weight: 700;
        }

        .countdown-container {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        /* Clean Glassmorphism look */
        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.5rem;
            min-width: 110px;
            backdrop-filter: blur(12px);
        }

        .time-box span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .time-box label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.8rem;
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }

        .discord-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.25);
        }

        .discord-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            .countdown-container {
                gap: 0.8rem;
            }
            .time-box {
                padding: 1rem;
                min-width: 75px;
            }
            .time-box span {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="gravijet logo" style="width: 100px; height: 100px; margin-bottom: 2rem;">
    <h1>example.invalid is back!</h1>
    <div class="subtitle">Closed Beta Starts In</div>

    <div class="countdown-container" id="countdown">
        <div class="time-box">
            <span id="days">00</span>
            <label>Days</label>
        </div>
        <div class="time-box">
            <span id="hours">00</span>
            <label>Hours</label>
        </div>
        <div class="time-box">
            <span id="minutes">00</span>
            <label>Minutes</label>
        </div>
        <div class="time-box">
            <span id="seconds">00</span>
            <label>Seconds</label>
        </div>
    </div>

    <a href="https://discord.gg/bCazUBWc99" class="discord-btn" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 127.14 96.36">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.33,46,96.22,53,91.17,65.69,84.69,65.69Z"/>
        </svg>
        Join Discord
    </a>

    <script>
        // Set exactly to May 2nd, 2026 at 13:00 Austrian Time (UTC+2 / CEST)
        const targetDate = new Date("2026-05-02T13:00:00+02:00").getTime();

        const updateCountdown = () => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<div class='subtitle'>The Closed Beta has begun!</div>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        };

        setInterval(updateCountdown, 1000);
        updateCountdown(); 
    </script>
</body>
</html>
