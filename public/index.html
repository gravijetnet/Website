<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravijet — Practice network statistics</title>
<meta name="description" content="Live statistics for the Gravijet Minecraft practice network. Track Bedwars, Duels, FFA and FastBuilder stats, per-player profiles and top leaderboards.">
<meta name="theme-color" content="#0b0b0b">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Gravijet">
<meta property="og:title" content="Gravijet — Practice network statistics">
<meta property="og:description" content="Bridging, clutching, PvP and speed-building. Every round you play on Gravijet is measured, ranked and kept.">
<meta property="og:url" content="https://example.invalid/">
<meta property="og:image" content="https://example.invalid/assets/img/logo.png">
<meta name="twitter:card" content="summary">

<link rel="icon" href="/assets/img/logo.webp" type="image/webp">
<link rel="apple-touch-icon" href="/assets/img/logo.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="nav" id="nav"></header>
  <main id="app"></main>
  <footer class="footer" id="footer"></footer>
  <!-- data-cfasync="false" is the documented opt-out from Cloudflare's Rocket
       Loader, which is on for this zone and was rewriting type="module" to
       type="<token>-module" so the browser would ignore the tag and let Rocket
       Loader run it later instead. That trick is built for classic scripts; this
       is an ES module graph, and having it deferred and re-entered by a third
       party is a fragility nobody asked for. -->
  <script type="module" data-cfasync="false" src="/assets/js/main.js"></script>
  <noscript>
    <div class="notice">
      <h2>JavaScript required</h2>
      <p>Gravijet statistics are rendered in your browser. Please enable JavaScript.</p>
    </div>
  </noscript>
</body>
</html>
